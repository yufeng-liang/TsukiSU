name: Build ksuinit

# Self-hosted runner variant: no marketplace actions. NDK/rustup come from
# .github/scripts/ci and artifacts go to ${CI_ARTIFACT_ROOT} on the runner host.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
jobs:
  # Forgejo shows the calling job (ci.yml's `build-kuinit`) and this expanded
  # job as two rows, and dedupes equal display names to `-1`. The caller already
  # owns "build-kuinit", so this row is named after what it builds.
  kuinit:
    name: kuinit
    runs-on: ${{ inputs.os }}
    env:
      CARGO_HOME: /ci/tools/cargo
      RUSTUP_HOME: /usr/local/rustup
      # Same reason as MAKEFLAGS in ddk-lkm: cap per-job parallelism.
      CARGO_BUILD_JOBS: "6"
      # Artifacts travel through CNB; without a token they stay on /ci only.
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-release' }}
      CNB_ARTIFACT_REPO: ${{ vars.CNB_ARTIFACT_REPO || 'shirkneko/sukisu-artifacts' }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /ci/tools/bin/ci-checkout

      - name: Check toolchain
        run: |
          set -eux
          rustup toolchain list
          rustup target list --installed
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      # All four targets build the same way, so one loop replaces four copies of
      # the same build-and-upload pair. Two things differ per target, and both
      # are data here:
      #
      #   riscv64 needs the pinned nightly with -Z build-std, because no
      #   prebuilt std ships for that target, and it alone links against API 35.
      #
      #   The clang runtime archive is named after the ABI, and armv7 drops the
      #   "v7-linux-androideabi" part, so the suffix cannot be derived from the
      #   triple mechanically.
      #
      #   <triple> <api level> <artifact name> <clang-rt ABI suffix>
      - name: Build ksuinit for every target
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"

          targets=(
            "aarch64-linux-android 26 ksuinit-aarch64 aarch64"
            "armv7-linux-androideabi 26 ksuinit-arm arm"
            "x86_64-linux-android 26 ksuinit-x86_64 x86_64"
            "riscv64-linux-android 35 ksuinit-riscv64 riscv64"
          )

          for spec in "${targets[@]}"; do
            read -r triple api artifact abi <<<"$spec"
            echo "=== ${triple} (API ${api}) ==="

            source .github/scripts/setup-rust-build.sh "$triple" "$api"
            builtins="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-${abi}-android.a"
            test -f "$builtins"
            export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$builtins"

            case "$triple" in
              riscv64-*)
                cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml \
                  -Z build-std=std,panic_abort --package ksuinit \
                  --target="$triple" --release
                ;;
              *)
                cargo build --package ksuinit --target="$triple" --release
                ;;
            esac

            ci_artifact_put "$artifact" "target/${triple}/release/ksuinit"
          done

      - name: Write the job summary
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_summary_artifacts \
            "ksuinit-aarch64" "ksuinit-arm" "ksuinit-x86_64" "ksuinit-riscv64"
