name: Publish Manager

# Publishes the repacked APKs: a rolling `manager-ci` build on main, a
# `manager-dev` build on dev, and the Telegram upload. Both used to be separate
# jobs doing the same split-and-sign work twice, so they are one job now.
#
# The channel is what keeps the two branches apart: main keeps the tag the
# manager's CI updater reads, dev gets its own prerelease, and neither overwrites
# the other's APKs. Any other ref signs nothing and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      artifacts_run:
        description: 'Run id holding the Manager artifacts (empty = this run)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Sign and publish the APKs (disable for pull requests)'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      artifacts_run:
        description: 'Run id holding the Manager artifacts (empty = this run)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Sign and publish the APKs (disable for pull requests)'
        required: false
        default: true
        type: boolean
      release_upload:
        description: 'Upload to the releases Telegram thread'
        required: false
        default: false
        type: boolean

jobs:
  # ci.yml and release.yml both call this job as `publish`, and Forgejo shows
  # the caller next to the expanded job: a job also called `publish` showed up
  # as `publish-1`. Distinct id, explicit display name.
  publish-manager:
    name: publish-manager
    if: ${{ inputs.publish }}
    runs-on: android
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /ci/tools/bin/ci-checkout

      - name: Check toolchain
        run: |
          set -eux
          apksigner --version
          python3 --version

      # One channel per branch. main owns `manager-ci` because the manager's CI
      # updater reads that tag; a dev push must never replace the build main was
      # tested with, so dev gets `manager-dev`. Both are prereleases, which keeps
      # them out of the stable update channel.
      #
      # A dispatch from any other ref publishes nothing: it would otherwise
      # create a release tag per topic branch.
      - name: Resolve the release channel
        id: channel
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            main) channel=ci; title="Manager CI" ;;
            dev) channel=dev; title="Manager Dev" ;;
            *)
              echo "branch ${GITHUB_REF_NAME:-?} has no release channel; keeping the APKs on /ci"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          {
            echo "publish=true"
            echo "tag=manager-${channel}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"
          echo "release channel: manager-${channel} (${title})"

      - name: Provide node and the action sources
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_provide_node
      - name: Download APKs
        id: download_apks
        if: ${{ inputs.publish }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_RUN: ${{ inputs.artifacts_run }}
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_download_artifact sukisu-manager "${GITHUB_WORKSPACE}/apks/Manager" "${ARTIFACTS_RUN:-}"

      - name: Download APKs (Forgejo fallback)
        if: inputs.publish && steps.download_apks.outcome == 'failure' && inputs.artifacts_run == ''
        uses: ./.ci-actions/download-artifact
        with:
          name: sukisu-manager
          path: apks/Manager

      - name: Prepare signing inputs
        if: ${{ inputs.publish }}
        env:
          PROD_KEYSTORE: ${{ vars.KEYSTORE || secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ vars.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$PROD_KEYSTORE"
          echo "$PROD_KEYSTORE" | base64 -d > key.jks
          echo "SIGN_KEYSTORE_FILE=key.jks" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Split and sign by architecture
        if: ${{ inputs.publish }}
        run: |
          set -eu
          apk="$(find apks/Manager -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 split_apk_by_arch.py             -i "$apk"             -o apks/split             -K "$SIGN_KEYSTORE_FILE"             -A "$SIGN_KEY_ALIAS"             -P "$SIGN_KEYSTORE_PASSWORD"             -S "$SIGN_KEY_PASSWORD"
          # Each split APK must carry exactly one architecture.
          for split in apks/split/*.apk; do
            echo "-- $split"
            unzip -l "$split" | grep ' lib/' | awk -F/ '{print $2}' | sort -u
          done

      - name: Publish rolling build on /ci
        if: ${{ inputs.publish && steps.channel.outputs.publish == 'true' }}
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          test -n "$(find apks/split -type f -name '*.apk' -print -quit)"
          tag='${{ steps.channel.outputs.tag }}'
          title='${{ steps.channel.outputs.title }}'
          published="${CI_ARTIFACT_ROOT}/${tag}/${GITHUB_SHA}"
          mkdir -p "$published"
          cp -f apks/split/*.apk "$published"/
          {
            printf '## %s\n\n' "$title"
            printf -- '- **Branch:** `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- **Commit:** `%s`\n' "$GITHUB_SHA"
            printf -- '- **Build:** %s\n\n' "${GITHUB_RUN_NUMBER:-unknown}"
            printf '> Experimental build; may be unstable.\n\n### Recent changes\n\n'
            git log -5 --format='- %s (`%h`)' "$GITHUB_SHA"
          } > "$published/notes.md"
          echo "published to ${published}"

      # CNB is the upload target for the APKs: its release assets are served
      # from cnb.cool and the upload goes machine-to-machine, so the tunnel to
      # this host only ever sees small API calls. Every later step works from
      # what CNB holds.
      - name: Upload the signed manager to CNB
        if: ${{ inputs.publish && steps.channel.outputs.publish == 'true' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-result' }}
          CNB_TAG: ${{ steps.channel.outputs.tag }}
          CNB_ASSETS_DIR: apks/split
          CNB_BODY_FILE: cnb-notes.md
          CNB_PRERELEASE: "true"
          CNB_MAKE_LATEST: "false"
          # Rolling channels are deleted and recreated every build: CNB keeps
          # the original published_at on update, and its release pages embed
          # only the newest ten, so an updated-in-place release would slowly be
          # pushed off the page the manager's updater reads.
          CNB_RECREATE: "true"
          CNB_TARGET_COMMITISH: ${{ vars.CNB_TARGET_COMMITISH || 'main' }}
        run: |
          set -eu
          tag='${{ steps.channel.outputs.tag }}'
          title='${{ steps.channel.outputs.title }}'
          apk="$(find apks/split -type f -name '*.apk' | head -n1)"
          code="${apk##*_}"
          code="${code%%-*}"
          export CNB_NAME="${title} (${code})"
          {
            echo "# ${title} (${code})"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Run: ${GITHUB_RUN_NUMBER:-unknown}"
            echo
            # Only the commit being published: the changelog is the release
            # notes, and a rolling channel's value is "what is in this build",
            # not a scrolling history that repeats itself every run.
            echo "## Latest commit"
            echo
            echo '```'
            git log -1 --format='%B'
            echo '```'
          } > cnb-notes.md
          echo "uploading to CNB release ${tag}"
          bash .github/scripts/ci/cnb-upload.sh

      # The summary is written right after the upload: the links are only valid
      # once CNB holds the files, and a later step failing must not hide them.
      - name: Write the job summary
        if: ${{ inputs.publish && steps.channel.outputs.publish == 'true' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-result' }}
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_summary_release \
            "${{ steps.channel.outputs.title }}" \
            "${{ steps.channel.outputs.tag }}" \
            apks/split/*.apk

      # The APKs stay on CNB: pushing them into the release here means ~43 MB
      # through the tunnel at ~90 KB/s, which never finished. The Forgejo release
      # therefore carries links to the CNB assets instead of copies of them.
      #
      # Consequence: the manager's Forgejo update source has no APK to offer for
      # this tag; its CNB source (the default) does.
      - name: Point the release at CNB
        if: ${{ inputs.publish && steps.channel.outputs.publish == 'true' }}
        env:
          # Dedicated token with write:repository. The built-in GITHUB_TOKEN is
          # only a fallback: it may lack release permissions on this instance.
          API_TOKEN: ${{ secrets.RELEASE_API_TOKEN || vars.RELEASE_API_TOKEN || secrets.GITHUB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-result' }}
          CNB_WEB: ${{ vars.CNB_WEB || 'https://cnb.cool' }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
          RELEASE_TITLE: ${{ steps.channel.outputs.title }}
          # Rolling channels recreate the release each time so its tag moves to
          # this build's commit; a stable release keeps its existing tag.
          RELEASE_RECREATE: "true"
        run: |
          set -eu
          src=apks/split
          apk="$(find "$src" -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          # SukiSU_Nova_<ref>_35001-arm64-v8a-release.apk -> 35001
          base="$(basename "$apk")"
          code="${base##*_}"
          code="${code%%-*}"
          # The app parses the version out of the release title, so a name that
          # does not carry one must fail here rather than publish a broken release.
          case "$code" in
            '' | *[!0-9]*) echo "cannot parse the version code from ${base}" >&2; exit 1 ;;
          esac
          export RELEASE_NAME="${RELEASE_TITLE} (${code})"
          export RELEASE_PRERELEASE=true
          # One link, not a table: the CNB release page lists every split, and
          # this release stores no bytes any more.
          RELEASE_BODY="$(printf 'Rolling %s build from %s. Experimental; may be unstable.\n\n下载 / Download: %s/%s/-/releases/tag/%s\n' \
            "$RELEASE_TITLE" "$GITHUB_REF_NAME" "$CNB_WEB" "$CNB_REPO" "$RELEASE_TAG")"
          export RELEASE_BODY
          bash .github/scripts/ci/forgejo-release.sh
      - name: Check Telegram configuration
        id: telegram
        env:
          BOT_TOKEN: ${{ vars.BOT_TOKEN || secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || secrets.CHAT_ID }}
        run: |
          set -eu
          if [ -n "${BOT_TOKEN:-}" ] && [ -n "${CHAT_ID:-}" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "Telegram upload skipped: set BOT_TOKEN and CHAT_ID to enable it"
          fi

      # Telegram delivery is delegated to CNB so a local network failure cannot
      # break the build. The CNB pipeline downloads the APKs from the channel's
      # release, so this runs on main and dev alike; only the tag differs.
      #
      # MESSAGE_DEV_THREAD_ID keeps dev drops out of the main topic when it is
      # set, and falls back to MESSAGE_THREAD_ID when it is not.
      - name: Trigger CNB Telegram delivery
        if: ${{ inputs.publish && steps.channel.outputs.publish == 'true' && steps.telegram.outputs.upload == 'true' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-result' }}
          CNB_TAG: ${{ steps.channel.outputs.tag }}
          CNB_KIND: manager
          THREAD_ID: ${{ vars.MESSAGE_THREAD_ID || '' }}
          DEV_THREAD_ID: ${{ vars.MESSAGE_DEV_THREAD_ID || '' }}
          BOT_TOKEN: ${{ vars.BOT_TOKEN || secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || secrets.CHAT_ID }}
          TG_API_BASE: ${{ vars.TG_API_BASE || 'https://api.telegram.org' }}
          TITLE: ${{ steps.channel.outputs.title }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: https://git.zako.shirkneko.top:20004/${{ github.repository }}/actions/runs/${{ github.run_number || github.run_id }}
          EVENT: ${{ toJson(github.event) }}
        run: bash .github/scripts/ci/telegram-trigger.sh

      # Manual fallback only: if CNB cannot run the delivery, drop the `if: false`
      # below and the same split APKs go out directly. It stays off because a
      # flaky tunnel used to fail the whole job here.
      - name: Upload to Telegram (legacy, disabled)
        if: ${{ false }}
        timeout-minutes: 20
        env:
          CHAT_ID: ${{ vars.CHAT_ID || secrets.CHAT_ID }}
          BOT_TOKEN: ${{ vars.BOT_TOKEN || secrets.BOT_TOKEN }}
          GITHUB_EVENT: ${{ toJson(github.event) }}
          # The public endpoint again: github.server_url points at the tunnel address,
          # so the link in the Telegram message would not open for anyone.
          RUN_URL: https://git.zako.shirkneko.top:20004/${{ github.repository }}/actions/runs/${{ github.run_number || github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          export VERSION="$(git rev-list --count HEAD)"
          export TITLE="Manager"
          # Releases go to their own topic; regular builds use the default one.
          export MESSAGE_THREAD_ID="${{ inputs.release_upload && (vars.MESSAGE_RELEASES_THREAD_ID || secrets.MESSAGE_RELEASES_THREAD_ID) || vars.MESSAGE_THREAD_ID || secrets.MESSAGE_THREAD_ID }}"
          mapfile -d '' APKS < <(find ./apks/split -type f -name '*.apk' -print0 | sort -z)
          test "${#APKS[@]}" -gt 0

          # Deleting and re-creating a tag pushes it again and re-runs the whole
          # release, so the same build must not reach the topic twice.
          #
          # The identity of a build is the topic, the ref, the commit AND the bytes
          # of the APK:
          #   - the version code is derived from the commit count, so it goes
          #     backwards on a revert and must not be the key
          #   - the ref keeps dev, main, tags and pull requests in separate slots
          #   - the hash means a rebuild of the same commit (different signer,
          #     different toolchain, changed files in the APK) still uploads
          code="$(basename "${APKS[0]}" | sed -E 's/.*_([0-9]+)-[a-z0-9_-]+-release\.apk$/\1/')"
          sha="$(git rev-parse --short=8 HEAD 2>/dev/null || printf '%s' "${GITHUB_SHA:-unknown}" | cut -c1-8)"
          ref="$(printf '%s' "${GITHUB_REF_NAME:-${GITHUB_REF:-unknown}}" | tr '/' '-')"
          apk_hash="$(sha256sum "${APKS[0]}" | cut -c1-16)"
          topic="${MESSAGE_THREAD_ID:-default}"
          marker="/ci/state/telegram-${topic}-${ref}-${sha}-${apk_hash}.sent"
          mkdir -p "$(dirname "$marker")"
          # markers are only useful while the commit is still recent
          find /ci/state -type f -mtime +30 -delete 2>/dev/null || true
          if [ -f "$marker" ]; then
            echo "build ${ref}@${sha} apk ${apk_hash} (version ${code}) was already uploaded to topic ${topic} ($(cat "$marker")), skipping"
            exit 0
          fi

          bash .github/scripts/upload-telegram.sh "${APKS[@]}"
          date -u +%FT%TZ >"$marker"
