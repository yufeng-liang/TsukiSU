name: Validate workflows

# Runs the same validator as the documented pre-commit hook
# (forgejo-runner validate), so a broken workflow file fails here instead of in
# the build job. The binary is pre-seeded in /ci/tools/bin.

on:
  workflow_dispatch:
  # Only the two long-lived branches build. A scratch branch is created to be
  # pushed and thrown away, so a validation run there costs a runner slot and
  # tells nobody anything: the same files get validated when the branch is
  # opened as a pull request against main/dev.
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: base

    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /ci/tools/bin/ci-checkout

      - name: Validate the workflow files
        run: |
          set -eux
          if [ ! -x /ci/tools/bin/forgejo-runner ]; then
            echo "forgejo-runner is missing from /ci/tools/bin on this runner;" >&2
            echo "seed it once, see the runner README" >&2
            exit 1
          fi
          /ci/tools/bin/forgejo-runner validate --directory .

          count=$(find .github/workflows -name '*.y*ml' | wc -l)
          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          if [ -n "$summary" ]; then
            {
              echo "## 工作流校验"
              echo
              echo "全部 ${count} 个 workflow 通过 \`forgejo-runner validate\`。"
            } >> "$summary"
          fi

      # `bash -n` only parses: it cannot tell that a library stopped defining a
      # helper the workflows still call. That shipped twice (common.sh lost
      # ci_artifact_manifest, cnb.sh lost cnb_asset_put) and broke every producer
      # job. Source the libraries and resolve the public helpers by name; add a
      # name here when you add one to common.sh / cnb.sh / parallel.sh.
      - name: Check the CI helpers resolve
        run: |
          set -eu
          . .github/scripts/ci/common.sh
          . .github/scripts/ci/parallel.sh
          missing=""
          for fn in \
            ci_provide_node ci_artifact_path ci_artifact_manifest ci_artifact_put \
            ci_artifact_cnb_tag ci_artifact_cnb_put ci_artifact_names \
            ci_download_artifact ci_download_all_artifacts ci_cnb_link_base \
            ci_summary_artifacts ci_parallel_acquire ci_parallel_release \
            cnb_api_base cnb_web_base cnb_enabled cnb_curl cnb_release_id \
            cnb_release_ensure cnb_release_patch cnb_release_assets \
            cnb_release_delete cnb_tag_delete cnb_asset_delete cnb_clear_assets cnb_asset_put cnb_asset_get; do
            command -v "$fn" >/dev/null 2>&1 || missing="${missing} ${fn}"
          done
          test -z "$missing" || {
            echo "these helpers are used but not defined:${missing}" >&2
            exit 1
          }
          echo "all helpers resolve"

      # A workflow that calls a script by path fails on a runner, minutes into
      # the job. This catches a moved or renamed file at the top of the run
      # instead, which matters now that the scripts live in several directories.
      # /ci/tools/bin/ci-checkout is host-provided and deliberately not checked.
      - name: Check the referenced scripts exist
        run: |
          set -eu
          missing=""
          for f in \
            .github/scripts/ci/common.sh \
            .github/scripts/ci/cnb.sh \
            .github/scripts/ci/cnb-upload.sh \
            .github/scripts/ci/parallel.sh \
            .github/scripts/ci/ci-checkout.sh \
            .github/scripts/ci/telegram-trigger.sh \
            .github/scripts/ci/forgejo-release.sh \
            .github/scripts/upload-telegram.sh \
            .github/scripts/setup-rust-build.sh; do
            [ -f "$f" ] || missing="${missing} ${f}"
          done
          test -z "$missing" || {
            echo "these files are referenced but missing:${missing}" >&2
            exit 1
          }
          echo "all referenced scripts exist"
