name: ClangFormat check

# Self-hosted runner variant: no marketplace actions, so nothing is fetched
# from github.com. Checkout pulls from the public Forgejo endpoint because build
# containers cannot reach the WSL EasyTier tunnel.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'

permissions:
  checks: write

jobs:
  format:
    runs-on: base
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /ci/tools/bin/ci-checkout

      - name: Check toolchain
        run: clang-format --version

      - name: check
        working-directory: kernel
        run: make format

      - name: check
        working-directory: kernel
        run: make check-format
